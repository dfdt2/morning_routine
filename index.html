<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16191f"><link rel="icon" type="image/jpeg" href="./moon.jpg"><link rel="apple-touch-icon" href="./moon.jpg">
<title>Goodnight</title>
<style>
:root{color-scheme:dark;--bg:#16191f;--surface:#27374f;--surface-2:#2e4771;--text:#f5f7fc;--muted:#d0dcf1;--border:#516987;--focus:#adc8ff}
*{box-sizing:border-box}
html{touch-action:pan-x pan-y}
body{margin:0;min-height:100vh;background:linear-gradient(165deg,#1c2027 0%,#15181e 68%,#11151a 100%);color:var(--text);font:16px/1.42 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:570px;margin:0 auto;padding:27px 16px max(55px,env(safe-area-inset-bottom))}
h1{font-size:29px;letter-spacing:-.6px;font-weight:680;margin:0 0 23px;color:var(--text)}
section,.settings-panel{background:linear-gradient(135deg,#2c4263 0%,#34588b 56%,#304b76 100%);border:1px solid #4d6890;border-radius:17px;padding:19px;margin:13px 0;box-shadow:0 8px 24px #05090f38;color:var(--text)}
h2{font-size:18px;font-weight:650;margin:0 0 14px;color:var(--text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
label,.row label{font-size:16px;color:var(--text)}
input,select{color:var(--text);background:#263955;border:1px solid #7793b8;border-radius:11px;padding:11px;font:inherit;max-width:100%;color-scheme:dark}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=time]{font-size:16px;width:145px}
input[type=checkbox]{accent-color:#b6d2ff;width:20px;height:20px}
select{width:130px}
button{cursor:pointer;font:inherit}
.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.option{min-width:0;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;border:1px solid #98b1d655;border-radius:11px;padding:10px 2px;line-height:1.3;text-align:center}
.option b{display:block;font-size:16px;font-weight:650}
.option small{display:block;font-size:14px;color:#f3f6ff;margin-top:5px}
.cycle-3{background:#253b61}.cycle-4{background:#3b5480}.cycle-5{background:#5473a1}.cycle-6{background:#7895c4}
.option.active{border-color:#e5f0ff;outline:2px solid #e5f0ff;outline-offset:-3px;box-shadow:0 0 0 1px #fff4 inset}
.option.active small{color:white}
input[type=text]{width:100%;margin:8px 0}
.primary{background:linear-gradient(120deg,#3d659b 0%,#648cc4 100%);border:1px solid #8aa8d0;color:white;font-weight:700;width:100%;font-size:17px;padding:16px;border-radius:13px;box-shadow:0 5px 16px #04081235}
.primary:active{transform:translateY(1px)}
.status{color:var(--muted);font-size:15px;margin:10px 1px 0;line-height:1.4}
.settings-panel{padding:0;overflow:hidden;background:linear-gradient(130deg,#263348 0%,#32496c 100%)}
.settings-panel summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;padding:18px;font-size:17px;font-weight:650;color:var(--text)}
.settings-panel summary::-webkit-details-marker{display:none}
.settings-panel summary::after{content:"⌄";font-size:23px;font-weight:400;color:var(--text);transition:transform .2s}
.settings-panel[open] summary::after{transform:rotate(180deg)}
.details-body{padding:0 18px 9px;border-top:1px solid #587095}
@media(max-width:370px){.option b{font-size:14px}.option small{font-size:12px}main{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<main>
<h1>Goodnight</h1>
<section>
<div class="row"><label for="bed">Going to bed at</label><input id="bed" type="time" step="300"></div>
<div class="row"><label>Sleep cycles</label></div>
<div class="options" id="suggestions"></div>
<div class="row"><label for="wake">Wake-up time</label><input id="wake" type="time" step="300"></div>
</section>
<details class="settings-panel"><summary>Wake-up options</summary><div class="details-body">
<div class="row"><label for="sun">Hue sunrise</label><select id="sun"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></div>
<div class="row"><label for="musicOffset">Music before alarm</label><select id="musicOffset"><option value="0">At alarm</option><option value="5">5 min</option><option value="10" selected>10 min</option><option value="15">15 min</option><option value="20">20 min</option></select></div>
<div class="row"><label for="music">Spotify</label><input id="music" type="checkbox" checked></div>
<div class="row"><label for="alarm">iPhone alarm</label><input id="alarm" type="checkbox" checked></div>
<div class="row"><label for="chimes">Follow-up chimes</label><input id="chimes" type="checkbox" checked></div>
</div></details>
<details class="settings-panel"><summary>Music selection</summary><div class="details-body">
<div class="row"><label for="playlist">Playlist</label></div>
<input id="playlist" type="text" placeholder="Name or Spotify URL" autocomplete="off">
<div class="row"><label for="shuffle">Shuffle</label><input id="shuffle" type="checkbox" checked></div>
</div></details>
<button class="primary" id="setRoutine" type="button">Set Morning Routine</button>
<div id="status" class="status" role="status" aria-live="polite"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const ids=['sun','musicOffset','music','alarm','chimes','playlist','shuffle'];
const toMin=value=>{const [h,m]=value.split(':').map(Number);return h*60+m};
const toTime=value=>{let n=((value%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const formatted=value=>{const h=Number(value.slice(0,2)),m=value.slice(3);return (h%12||12)+':'+m+' '+(h<12?'AM':'PM')};
const quarterNow=()=>{const now=new Date();return toTime(Math.ceil((now.getHours()*60+now.getMinutes()+now.getSeconds()/60)/15)*15)};
const suggested=(bed,cycles)=>toTime(toMin(bed)+15+cycles*90);
const snapFive=value=>value&&/^\d{2}:\d{2}$/.test(value)?toTime(Math.round(toMin(value)/5)*5):value;
let chosenCycle=5;
const saved=(()=>{try{return JSON.parse(localStorage.getItem('morning_routine:v1')||'{}')}catch{return {}}})();
for(const id of ids){if(saved[id]!==undefined){if($(id).type==='checkbox')$(id).checked=Boolean(saved[id]);else $(id).value=saved[id]}}
const DEFAULT_PLAYLIST='https://open.spotify.com/playlist/2ugCg9q6yMsxQ4hQ8f9gba?si=142a8db13d024fff';
if(!$('playlist').value.trim()) $('playlist').value=DEFAULT_PLAYLIST;
$('bed').value=quarterNow();
$('wake').value=suggested($('bed').value,chosenCycle);
function renderSuggestions(){
  const wrap=$('suggestions');wrap.replaceChildren();
  for(const cycles of [3,4,5,6]){
    const value=suggested($('bed').value,cycles);
    const b=document.createElement('button');
    b.type='button';
    b.className='option cycle-'+cycles+($('wake').value===value?' active':'');
    const label=document.createElement('b');label.textContent=formatted(value);
    const sub=document.createElement('small');sub.textContent=cycles+' cycles';
    b.append(label,sub);
    b.addEventListener('click',()=>{chosenCycle=cycles;$('wake').value=value;renderSuggestions()});
    wrap.appendChild(b);
  }
}
function updateBed(){ if(!$('bed').value)return; $('bed').value=snapFive($('bed').value); if(chosenCycle!==null)$('wake').value=suggested($('bed').value,chosenCycle); renderSuggestions(); }
function updateWake(){ if(!$('wake').value)return; $('wake').value=snapFive($('wake').value); chosenCycle=[3,4,5,6].find(c=>suggested($('bed').value,c)===$('wake').value)??null; renderSuggestions(); }
$('bed').addEventListener('change',updateBed);
$('wake').addEventListener('change',updateWake);
renderSuggestions();
function settings(){
  const result={bed:$('bed').value,wake:$('wake').value};
  for(const id of ids)result[id]=$(id).type==='checkbox'?$(id).checked:$(id).value;
  return result;
}
$('setRoutine').addEventListener('click',()=>{
  updateBed();updateWake();
  const s=settings();
  if(!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(s.wake)){
    $('status').textContent='Choose a wake-up time.';return;
  }
  localStorage.setItem('morning_routine:v1',JSON.stringify(s));
  $('status').textContent='Opening Shortcuts…';
  // Keep the existing, tested Shortcut name. The button has a simpler user-facing name.
  window.location.href='shortcuts://run-shortcut?name='+encodeURIComponent('Set Morning Alarm')+'&input=text&text='+encodeURIComponent(s.wake);
});
</script>
</body>
</html>
